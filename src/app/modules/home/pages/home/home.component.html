<div class="banner-container">
  <img 
    [src]="APP_IMAGES.BANNER.MAIN_BANNER" 
    alt="Kinh Kỳ Heritage Banner"
    class="banner-image">
  <div class="banner-overlay" [class.banner-animate]="bannerLoaded">
    <div class="overlay-content">
      <h1 class="overlay-title">KINH KỲ HERITAGE<br>SEASONAL GIFTS</h1>
      <p class="overlay-subtitle">"Gìn giữ nét truyền thống - Tôn vinh giá trị di sản.<br>Trao gửi món quà mang dấu ấn thời gian."</p>
    </div>
  </div>
</div>
<app-featured-products
      appScrollAnimate
      animationClass="fade-in-up"
      animationDelay="0ms"
      id="san-pham"
      [sectionTitle]="'SẢN PHẨM NỔI BẬT'"
      [backgroundColor]="'#f5f0e8'"
      [productTitleColor]="'#2c5f4f'"
      [products]="myProducts">
    </app-featured-products>
    <app-description-kinh-ky 
      appScrollAnimate
      animationClass="fade-in-up"
      animationDelay="0ms">
    </app-description-kinh-ky>
    <app-about-us 
      appScrollAnimate
      animationClass="fade-in-up"
      animationDelay="0ms"
      id="ve-chung-toi">
    </app-about-us>
    <app-contact-us 
      appScrollAnimate
      animationClass="fade-in-up"
      animationDelay="0ms"
      id="lien-he">
    </app-contact-us>
